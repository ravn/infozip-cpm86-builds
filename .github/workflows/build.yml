name: build

on:
  push:
    branches: [main]
    tags: ['zip*-unzip*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Open Watcom toolchain
        run: ./setup-toolchain.sh

      # ubuntu-latest is x86-64, so build.sh runs the Watcom tools natively.
      - name: Cross-compile for 16-bit DOS
        run: ./build.sh

      - name: Verify the binaries are real-mode MZ images
        run: ./verify.sh

      # On a tag the version is the tag itself, e.g. zip3.0-unzip6.0-r1.
      - name: Package release assets
        run: |
          version=r1
          case "$GITHUB_REF_NAME" in
            zip*-unzip*) version="$GITHUB_REF_NAME" ;;
          esac
          echo "packaging version $version"
          ./package.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/zip')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
